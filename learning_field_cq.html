<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1e293b;--mut:#64748b;--bd:#dbe2ee;--hd:#0f172a;--ans:#f0fdf4;--ansb:#16a34a;--c:#2563eb;--a:#16a34a;--p:#7c3aed}
:root[data-theme=dark]{color-scheme:dark;--bg:#0b1220;--card:#131c2e;--tx:#e2e8f0;--mut:#94a3b8;--bd:#25324a;--hd:#1e293b;--ans:#0f2a1b;--ansb:#4ade80;--c:#60a5fa;--a:#4ade80;--p:#a78bfa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Bengali','Kalpurush','Siyam Rupali',sans-serif;line-height:1.8;padding:0 12px 40px}
.w{max-width:820px;margin:0 auto}
header{background:var(--hd);color:#fff;border-radius:12px;padding:20px;margin:16px 0}
header h1{margin:0;font-size:1.35rem}header p{margin:6px 0 0;color:#cbd5e1;font-size:.9rem}
.back{cursor:pointer;display:inline-block;margin-top:12px;color:var(--c);text-decoration:none;font-size:1.2rem;font-weight:600;padding:4px 0}.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{flex-wrap:nowrap;gap:6px}.bar button{flex:1 1 0;font-size:.85rem;padding:7px 4px;white-space:nowrap;text-align:center}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:5px 12px}
button.p{background:var(--c);color:#fff;border-color:var(--c)}
h2{border-bottom:3px solid var(--c);padding-bottom:6px;margin:28px 0 12px;font-size:1.2rem}
.card{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--cc);border-radius:10px;padding:14px;margin-bottom:16px}
.c{--cc:var(--c)}.a{--cc:var(--a)}.p2{--cc:var(--p)}
.card h3{margin:0 0 8px;font-size:1.02rem;color:var(--cc)}
.st{background:var(--bg);border:1px dashed var(--bd);border-radius:8px;padding:10px;margin-bottom:10px}
.q{margin:10px 0}.q b{color:var(--cc)}
.sh{font-size:.82rem;padding:2px 10px}
.ans{display:none;background:var(--ans);border-left:4px solid var(--ansb);border-radius:6px;padding:8px 12px;margin-top:6px}
.ans.on{display:block}
.m{font-size:.75rem;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:1px 10px;color:var(--mut);float:right}
@media print{.bar{display:none}.ans{display:block!important}body{background:#fff}}

.back{cursor:pointer;display:inline-block;margin-top:12px;color:var(--c);text-decoration:none;font-size:1.2rem;font-weight:600;padding:4px 0}
.top{display:flex;justify-content:flex-end;margin:0 0 10px}
.hc{cursor:pointer;display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--cc);border-radius:12px;padding:16px;margin-bottom:14px;transition:transform .15s,box-shadow .15s}
.hc:hover,.hc:focus-visible{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.12)}
.hc h2{margin:0;border:0;padding:0;font-size:1.15rem;color:var(--cc)}
.hc p{margin:4px 0 10px;color:var(--mut);font-size:.9rem}
.tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tags span{font-size:.75rem;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:1px 10px;color:var(--mut)}
.tags b{margin-left:auto;color:var(--cc);font-size:.9rem}
@media print{.back,.top{display:none}}
</style>

<script>
function dataBloom(){const G={0:'১. জ্ঞানীয় ক্ষেত্র (Cognitive Domain)',5:'২. আবেগীয় ক্ষেত্র (Affective Domain)',6:'৩. মনোপেশিজ ক্ষেত্র (Psychomotor Domain)'};
const D=[
{t:'জ্ঞান ও অনুধাবন স্তর (Remembering & Understanding)',k:'c',m:'Cognitive',s:'দশম শ্রেণির শিক্ষক মহিউদ্দিন সাহেব ক্লাসে ছাত্রছাত্রীদের নিউটনের গতিসূত্রগুলো মুখস্থ করতে বললেন এবং এর সংজ্ঞাগুলো খাতায় লিখতে দিলেন। পরের দিন তিনি শিক্ষার্থীদের বললেন, “তোমরা যে সূত্রগুলো মুখস্থ করেছ, নিজস্ব ভাষায় এর মূল অর্থ আমাকে বুঝিয়ে বলো এবং বাস্তব জীবনের একটি উদাহরণ দিয়ে ব্যাখ্যা করো।”',q:[
['বেঞ্জামিন ব্লুম জ্ঞান অর্জনের মূল উদ্দেশ্যকে কয়টি ডোমেইনে ভাগ করেছিলেন?','তিনটি ডোমেইনে — জ্ঞানীয় (Cognitive), আবেগীয় (Affective) ও মনোপেশিজ (Psychomotor)।'],
['শিক্ষকের নির্দেশ অনুযায়ী ‘সংজ্ঞা লেখা’ এবং ‘নিজের ভাষায় ব্যাখ্যা করা’-এর মধ্যকার পার্থক্য বুঝিয়ে লেখো।','সংজ্ঞা লেখা হলো শেখা তথ্য হুবহু মনে রেখে প্রকাশ করা, যা জ্ঞান (স্মরণ) স্তরের কাজ। নিজের ভাষায় ব্যাখ্যা করা হলো বিষয়টির অর্থ বুঝে অন্য শব্দে ও উদাহরণে প্রকাশ করা, যা অনুধাবন স্তরের কাজ। প্রথমটিতে মুখস্থ শক্তি লাগে, দ্বিতীয়টিতে বোঝার ক্ষমতা লাগে।'],
['উদ্দীপকে মহিউদ্দিন সাহেবের প্রথম নির্দেশটি ব্লুমস ট্যাকসোমির জ্ঞানীয় ক্ষেত্রের কোন স্তরের প্রতিনিধিত্ব করে? আলোচনা করো।','প্রথম নির্দেশটি জ্ঞান (Remembering) স্তরের প্রতিনিধিত্ব করে। এই স্তরে শিক্ষার্থী তথ্য, সংজ্ঞা, সূত্র মনে রাখে ও স্মরণ করে। উদ্দীপকে শিক্ষার্থীরা গতিসূত্র মুখস্থ করে সংজ্ঞা লিখেছে, অর্থাৎ নতুন কিছু না বানিয়ে শেখা তথ্য স্মরণ করেছে। তাই এটি জ্ঞান স্তরের কাজ।'],
['শিক্ষণ প্রক্রিয়ায় শিক্ষার্থীকে দ্বিতীয় নির্দেশটি অনুসরণ করতে দেওয়ার গুরুত্ব মূল্যায়ন করো।','দ্বিতীয় নির্দেশটি শিক্ষার্থীকে অনুধাবন স্তরে নিয়ে যায়। শুধু মুখস্থ করলে শিখন ভঙ্গুর হয়, কিন্তু নিজের ভাষায় ব্যাখ্যা ও বাস্তব উদাহরণ দিলে ধারণা স্পষ্ট হয় এবং ভুল বোঝাবুঝি ধরা পড়ে। এতে শিক্ষক বুঝতে পারেন শিক্ষার্থী আসলে কতটা বুঝেছে। এ অনুশীলন প্রয়োগ ও বিশ্লেষণের মতো উঁচু স্তরের ভিত্তি তৈরি করে এবং শিখনকে দীর্ঘস্থায়ী করে। তাই এ নির্দেশটি শিখন প্রক্রিয়ায় অত্যন্ত গুরুত্বপূর্ণ।']]},
{t:'প্রয়োগ স্তর (Applying)',k:'c',m:'Cognitive',s:'নবম শ্রেণির বিজ্ঞান ক্লাসে শিক্ষক ‘সালোকসংশ্লেষণ’ প্রক্রিয়াটি তত্ত্বীয়ভাবে পড়ানোর পর শিক্ষার্থীদের একটি কাজ দিলেন। শিক্ষার্থীরা শিক্ষকের দেওয়া নির্দেশনা অনুযায়ী বিজ্ঞানাগারে নির্দিষ্ট উপকরণ ব্যবহার করে উদ্ভিদের সালোকসংশ্লেষণ প্রক্রিয়ায় অক্সিজেন নির্গমন পরীক্ষাটি সফলভাবে সম্পন্ন করল।',q:[
['ব্লুমস ট্যাকসোমির জ্ঞানীয় ক্ষেত্রের ৩য় স্তরটির নাম কী?','প্রয়োগ (Applying)।'],
['ব্লুমস ট্যাকসোমির ক্ষেত্রে ‘প্রয়োগ’ (Applying) স্তরটি বলতে কী বোঝায়?','শেখা জ্ঞান, নিয়ম, সূত্র বা পদ্ধতি নতুন বা বাস্তব কোনো পরিস্থিতিতে ব্যবহার করার সক্ষমতাকে প্রয়োগ স্তর বলে।'],
['উদ্দীপকের শিক্ষার্থীরা বিজ্ঞান ক্লাসের অর্জনকে ব্লুমস ট্যাকসোমির কোন স্তরে বাস্তবায়ন করেছে? ব্যাখ্যা করো।','তারা প্রয়োগ (Applying) স্তরে বাস্তবায়ন করেছে। তারা ক্লাসে সালোকসংশ্লেষণের তত্ত্ব শিখেছিল এবং সেই জ্ঞান কাজে লাগিয়ে বিজ্ঞানাগারে উপকরণ ব্যবহার করে অক্সিজেন নির্গমন পরীক্ষাটি সম্পন্ন করেছে। অর্থাৎ শেখা তত্ত্বকে বাস্তব পরিস্থিতিতে ব্যবহার করেছে, যা প্রয়োগ স্তরের বৈশিষ্ট্য।'],
['“তাত্ত্বিক জ্ঞান অর্জনের পর তা প্রয়োগের মাধ্যমে শিখন স্থায়ী হয়”—উদ্দীপকের আলোকে উক্তিটি বিশ্লেষণ করো।','উক্তিটি যথার্থ। উদ্দীপকে শিক্ষার্থীরা আগে তত্ত্ব শিখেছে, পরে পরীক্ষার মাধ্যমে তা প্রয়োগ করেছে। নিজ হাতে কাজ করে ফল দেখার ফলে সালোকসংশ্লেষণ ও অক্সিজেন নির্গমনের সম্পর্ক তাদের কাছে স্পষ্ট হয়েছে। শুধু পড়ে বা শুনে শেখা বিষয় সহজে ভুলে যাওয়া যায়, কিন্তু প্রয়োগের অভিজ্ঞতা স্মৃতিতে দৃঢ়ভাবে গেঁথে যায় এবং সমস্যা সমাধানের দক্ষতা বাড়ায়। তাই প্রয়োগের মাধ্যমে শিখন স্থায়ী হয়।']]},
{t:'বিশ্লেষণ স্তর (Analyzing)',k:'c',m:'Cognitive',s:'একাদশ শ্রেণির ইতিহাস ক্লাসে শিক্ষক দুটি ভিন্ন শাসনব্যবস্থা—‘গণতান্ত্রিক শাসনব্যবস্থা’ এবং ‘একনায়কতন্ত্র’ পড়ালেন। এরপর তিনি শিক্ষার্থীদের বললেন, উভয় ব্যবস্থার মূল উপাদানগুলো আলাদা করে তালিকাভুক্ত করতে এবং এদের মধ্যকার সাদৃশ্য ও বৈসাদৃশ্যগুলো চিহ্নিত করে একটি তুলনামূলক ছক তৈরি করতে।',q:[
['ব্লুমস ট্যাকসোমির সংশোধিত সংস্করণে ‘বিশ্লেষণ’ (Analyzing) স্তরটি কততম স্থানে রয়েছে?','চতুর্থ স্থানে (স্মরণ, অনুধাবন, প্রয়োগ, বিশ্লেষণ, মূল্যায়ন, সৃজন)।'],
['যেকোনো বিষয়ে ‘জ্ঞান অর্জন’ করা এবং ‘বিশ্লেষণ’ করার মধ্যে মূল পার্থক্য কী?','জ্ঞান অর্জনে তথ্য জেনে মনে রাখা হয়। বিশ্লেষণে বিষয়টিকে ছোট ছোট অংশে ভাগ করে অংশগুলোর মধ্যকার সম্পর্ক, কারণ, সাদৃশ্য ও বৈসাদৃশ্য খুঁজে বের করা হয়।'],
['শিক্ষকের নির্দেশ অনুযায়ী শিক্ষার্থীদের তুলনামূলক ছক তৈরি করার কাজটি ব্লুমস ট্যাকসোমির কোন স্তরের সাথে সামঞ্জস্যপূর্ণ? ব্যাখ্যা করো।','কাজটি বিশ্লেষণ (Analyzing) স্তরের সাথে সামঞ্জস্যপূর্ণ। শিক্ষার্থীরা দুটি শাসনব্যবস্থাকে উপাদানে ভেঙে আলাদা করবে এবং সাদৃশ্য-বৈসাদৃশ্য চিহ্নিত করে তুলনা করবে। কোনো জটিল বিষয়কে অংশে ভাগ করে অংশগুলোর সম্পর্ক নির্ণয় করাই বিশ্লেষণ স্তরের মূল বৈশিষ্ট্য।'],
['উচ্চতর চিন্তা-দক্ষতা অর্জনে ‘বিশ্লেষণ’ স্তরের ভূমিকা উদ্দীপকের আলোকে বিশ্লেষণ করো।','বিশ্লেষণ স্তর মুখস্থ ও সাধারণ বোঝাপড়া থেকে শিক্ষার্থীকে গভীর চিন্তার দিকে নিয়ে যায়। উদ্দীপকে দুটি শাসনব্যবস্থার তুলনা করতে গিয়ে শিক্ষার্থীরা কারণ-ফল সম্পর্ক বুঝবে, প্রমাণ যাচাই করবে এবং তথ্যের কাঠামো ধরতে শিখবে। এ দক্ষতা পরবর্তী ধাপে মূল্যায়ন ও সৃজনের জন্য অপরিহার্য, কারণ কোনো কিছু ভালোভাবে না বুঝে তার বিচার বা নতুন কিছু সৃষ্টি করা যায় না। তাই বিশ্লেষণ উচ্চতর চিন্তা-দক্ষতা গড়ে তোলার সেতুবন্ধন।']]},
{t:'মূল্যায়ন স্তর (Evaluating)',k:'c',m:'Cognitive',s:'একটি এলাকার স্থানীয় উন্নয়ন কমিটি বনভূমি কেটে সেখানে একটি ভারী শিল্প কারখানা স্থাপনের একটি প্রস্তাব নিয়ে সভা করল। কিছু সদস্য বললেন এতে কর্মসংস্থান বাড়বে, আবার পরিবেশবাদীরা যুক্তি দিলেন এর ফলে পরিবেশ মারাত্মকভাবে ধ্বংস হবে। পরিশেষে কমিটি দুটি পক্ষের যুক্তির ওজন ও পরিবেশগত প্রভাব বিচার-বিবেচনা করে কারখানার প্রস্তাবটি বাতিল করার সিদ্ধান্ত নিল।',q:[
['ব্লুমস ট্যাকসোমির মূল (১৯৫৬) সংস্করণে সর্বোচ্চ স্তরটির নাম কী ছিল?','মূল্যায়ন (Evaluation)।'],
['ব্লুমস ট্যাকসোমিতে ‘মূল্যায়ন’ (Evaluating) বলতে কী বোঝায়?','নির্দিষ্ট মানদণ্ড ও যুক্তির ভিত্তিতে কোনো তথ্য, ধারণা বা সিদ্ধান্তের মান বিচার করে মত বা সিদ্ধান্ত প্রদান করার দক্ষতাকে মূল্যায়ন বলে।'],
['উদ্দীপকের উন্নয়ন কমিটির সিদ্ধান্ত গ্রহণ প্রক্রিয়ায় ব্লুমস ট্যাকসোমির কোন উচ্চতর দক্ষতা প্রকাশিত হয়েছে? ব্যাখ্যা করো।','মূল্যায়ন (Evaluating) দক্ষতা প্রকাশিত হয়েছে। কমিটি কর্মসংস্থান ও পরিবেশ ধ্বংস—দুই পক্ষের যুক্তি পাশাপাশি রেখে এর ওজন ও পরিবেশগত প্রভাব বিচার করেছে এবং যুক্তির ভিত্তিতে প্রস্তাবটি বাতিলের সিদ্ধান্ত নিয়েছে। মানদণ্ডের আলোকে বিচার করে সিদ্ধান্তে পৌঁছানোই মূল্যায়ন স্তরের বৈশিষ্ট্য।'],
['বাস্তব জীবনে সঠিক ও গঠনমূলক সিদ্ধান্ত গ্রহণে ‘মূল্যায়ন’ দক্ষতার গুরুত্ব আলোচনা করো।','মূল্যায়ন দক্ষতা থাকলে মানুষ আবেগ বা চাপে নয়, বরং প্রমাণ ও যুক্তির ভিত্তিতে সিদ্ধান্ত নিতে পারে। উদ্দীপকে কমিটি স্বল্পমেয়াদি লাভের চেয়ে দীর্ঘমেয়াদি পরিবেশগত ক্ষতিকে গুরুত্ব দিয়েছে। ব্যক্তিগত জীবনে পেশা, বিনিয়োগ বা তথ্য যাচাইয়ের ক্ষেত্রেও এ দক্ষতা ভুল ও প্রতারণা থেকে রক্ষা করে। এটি সমাজ ও রাষ্ট্রের জন্য ভারসাম্যপূর্ণ ও টেকসই সিদ্ধান্ত নিতে সহায়ক।']]},
{t:'সৃজন বা সংশ্লেষণ স্তর (Creating)',k:'c',m:'Cognitive',s:'কম্পিউটার সায়েন্সের ছাত্র অর্ঘ্য দেখল তার এলাকার ছোট দোকানদাররা হিসাব-নিকাশ রাখতে গিয়ে বেশ সমস্যায় পড়ছে। সে বিভিন্ন দোকানদারের প্রতিদিনের সমস্যার তথ্য সংগ্রহ করল। এরপর সে তার শেখা প্রোগ্রামিং কোড ও নতুন কিছু নিজস্ব ধারণা একত্রিত করে একটি সহজ মোবাইল অ্যাপ তৈরি করল, যার মাধ্যমে দোকানদাররা সহজেই হিসাব রাখতে পারে।',q:[
['ব্লুমস ট্যাকসোমির ২০০১ সালের সংশোধিত সংস্করণে সর্বোচ্চ স্তর কোনটি?','সৃজন (Creating)।'],
['‘সৃজন’ (Creating) স্তরটি কেন উচ্চতর চিন্তন দক্ষতার চূড়ান্ত ধাপ—বুঝিয়ে লেখো।','এ স্তরে শিক্ষার্থী আগের সব স্তরের (স্মরণ, অনুধাবন, প্রয়োগ, বিশ্লেষণ, মূল্যায়ন) দক্ষতা কাজে লাগিয়ে বিভিন্ন উপাদান একত্র করে সম্পূর্ণ নতুন কিছু উদ্ভাবন করে। তাই এটি সবচেয়ে জটিল ও চূড়ান্ত ধাপ।'],
['অর্ঘ্যের নতুন অ্যাপ তৈরি করার কাজটি ব্লুমস ট্যাকসোমির কোন স্তরের সাথে সম্পর্কিত? ব্যাখ্যা করো।','কাজটি সৃজন (Creating) স্তরের সাথে সম্পর্কিত। অর্ঘ্য দোকানদারদের সমস্যা বিশ্লেষণ করেছে, তার শেখা প্রোগ্রামিং জ্ঞানের সাথে নিজস্ব ধারণা যুক্ত করেছে এবং একটি নতুন, কার্যকর মোবাইল অ্যাপ বানিয়েছে। বিভিন্ন উপাদান একত্র করে নতুন পণ্য উদ্ভাবনই সৃজন স্তরের বৈশিষ্ট্য।'],
['“অর্ঘ্যের এই উদ্ভাবনী কাজের মধ্য দিয়ে জ্ঞানীয় ক্ষেত্রের (Cognitive Domain) চূড়ান্ত সার্থকতা প্রমাণিত হয়”—উক্তিটি বিশ্লেষণ করো।','উক্তিটি যথার্থ। জ্ঞানীয় ক্ষেত্রের লক্ষ্য শুধু তথ্য জানা নয়, জ্ঞানকে কাজে লাগিয়ে নতুন কিছু সৃষ্টি করা। অর্ঘ্য প্রোগ্রামিং জ্ঞান স্মরণ করেছে ও বুঝেছে, তা প্রয়োগ করেছে, সমস্যা বিশ্লেষণ করেছে এবং উপযুক্ত সমাধান বেছে নিয়ে (মূল্যায়ন) শেষে নতুন অ্যাপ সৃজন করেছে। এভাবে সব স্তরের সমন্বয়ে বাস্তব সমস্যার সমাধান হয়েছে এবং সমাজ উপকৃত হয়েছে, যা জ্ঞানীয় ক্ষেত্রের চূড়ান্ত সার্থকতা।']]},
{t:'আবেগীয় ক্ষেত্র (Affective Domain)',k:'a',m:'Affective',s:'রাফিদ নিয়মিত স্কাউটিংয়ের সাথে যুক্ত। বনায়ন কর্মসূচিতে অংশ নেওয়ার পর থেকে গাছপালার প্রতি তার ভালোবাসা জন্মায়। এখন সে কেবল নিজেই নিয়মিত প্রাতঃভ্রমণে গাছগাছালির যত্ন নেয় না, বরং প্লাস্টিক বর্জ্য ফেলে পরিবেশ দূষণ করার বিরুদ্ধে বন্ধুদের সচেতন করে তোলে এবং নিজে সর্বদা এই নীতি মেনে চলে।',q:[
['ব্লুমের ‘আবেগীয় ক্ষেত্র’ (Affective Domain) মূলত শিক্ষার কোন দিকটি নিয়ে কাজ করে?','মনোভাব, অনুভূতি, আগ্রহ, মূল্যবোধ ও দৃষ্টিভঙ্গির বিকাশের দিকটি নিয়ে কাজ করে।'],
['আবেগীয় ক্ষেত্রের ‘মূল্যায়ন’ (Valuing) ও ‘চরিত্রায়ন’ (Characterization) স্তরের মধ্যকার পার্থক্য লেখো।','মূল্যায়ন (Valuing) স্তরে ব্যক্তি কোনো বিষয়ের মূল্য বা গুরুত্ব স্বীকার করে তার প্রতি আগ্রহ ও প্রতিশ্রুতি দেখায়। চরিত্রায়ন (Characterization) সর্বোচ্চ স্তর, যেখানে সেই মূল্যবোধ ব্যক্তির চরিত্রের স্থায়ী অংশ হয়ে যায় এবং সে সব সময় ও স্বতঃস্ফূর্তভাবে তা অনুযায়ী আচরণ করে।'],
['উদ্দীপকে রাফিদের পরিবেশ সচেতনতা ও নীতি মেনে চলার আচরণে আবেগীয় ক্ষেত্রের কোন স্তরগুলো ফুটে উঠেছে? ব্যাখ্যা করো।','এখানে কয়েকটি স্তর ফুটে উঠেছে। বনায়ন কর্মসূচিতে অংশ নেওয়া গ্রহণ ও সাড়াদান (Receiving ও Responding) স্তর। গাছের প্রতি ভালোবাসা জন্মানো ও যত্ন নেওয়া এবং বন্ধুদের সচেতন করা মূল্যায়ন (Valuing) স্তর। পরিবেশ রক্ষার মূল্যবোধ সংগঠিত করে নিজের জীবনে গ্রহণ করা সংগঠন (Organization) স্তর। সর্বদা এই নীতি মেনে চলাই চরিত্রায়ন (Characterization) স্তরের প্রকাশ।'],
['“কেবল জ্ঞান অর্জনই যথেষ্ট নয়, আচরণের ইতিবাচক পরিবর্তন ও মূল্যবোধ গঠনই শিক্ষার আসল উদ্দেশ্য”—উদ্দীপক ও ব্লুমের থিওরির আলোকে মূল্যায়ন করো।','উক্তিটি যুক্তিযুক্ত। ব্লুমের থিওরিতে জ্ঞানীয় ক্ষেত্রের পাশাপাশি আবেগীয় ক্ষেত্রকেও সমান গুরুত্ব দেওয়া হয়েছে। রাফিদ শুধু পরিবেশের তথ্য জানেনি; অনুভূতি ও মূল্যবোধের মাধ্যমে নিজের আচরণ বদলেছে এবং অন্যদেরও প্রভাবিত করেছে। মূল্যবোধহীন জ্ঞান সমাজের জন্য কল্যাণকর নাও হতে পারে। তাই জ্ঞানের সাথে ইতিবাচক আচরণ ও নৈতিক চরিত্র গঠনই শিক্ষার প্রকৃত উদ্দেশ্য।']]},
{t:'মনোপেশিজ বা কায়িক ক্ষেত্র (Psychomotor Domain)',k:'p2',m:'Psychomotor',s:'আরিফ ক্রিকেট অ্যাকাডেমিতে ভর্তি হয়ে প্রথমে কোচের বোলিং করার কৌশল দূর থেকে নিখুঁতভাবে লক্ষ্য করত (অনুকরণ)। পরবর্তীতে কোচের সহায়তায় চর্চা করতে করতে একসময় সে কোনো শারীরিক বা মানসিক চাপ ছাড়াই সম্পূর্ণ স্বতঃস্ফূর্ত ও নিখুঁতভাবে বল করা শিখে গেল। এখন ম্যাচ চলাকালীন সে যেকোনো অবস্থায় সঠিক অ্যাকশনে বল করতে পারে।',q:[
['মনোপেশিজ ক্ষেত্র (Psychomotor Domain) শিক্ষার কোন ধরনের দক্ষতার সাথে সম্পর্কিত?','শারীরিক বা কায়িক দক্ষতা, অর্থাৎ অঙ্গ-প্রত্যঙ্গের সঞ্চালন ও হাতে-কলমে কাজ করার দক্ষতার সাথে সম্পর্কিত।'],
['কায়িক দক্ষতায় ‘অনুকরণ’ (Imitation) এবং ‘স্বাভাবিকীকরণ’ (Naturalization)-এর দূরত্ব বুঝিয়ে লেখো।','অনুকরণ হলো প্রাথমিক ধাপ, যেখানে অন্যকে দেখে তার কাজ নকল করার চেষ্টা করা হয়; এতে ভুল ও আড়ষ্টতা থাকে। স্বাভাবিকীকরণ সর্বোচ্চ ধাপ, যেখানে দক্ষতা অভ্যাসে পরিণত হয় এবং কোনো চেষ্টা বা চাপ ছাড়াই স্বতঃস্ফূর্ত ও নিখুঁতভাবে কাজটি করা যায়। মাঝে থাকে অনুশীলন, নিখুঁতকরণ ও সমন্বয়ের ধাপ।'],
['আরিফের বোলিং শেখার প্রাথমিক ধাপ থেকে স্বতঃস্ফূর্তভাবে বোলিং করার দক্ষতা অর্জন মনোপেশিজ ক্ষেত্রের কোন স্তরগুলোকে নির্দেশ করে?','এটি অনুকরণ (Imitation) থেকে স্বাভাবিকীকরণ (Naturalization) পর্যন্ত স্তরগুলোকে নির্দেশ করে। শুরুতে কোচকে দেখে নকল করা অনুকরণ। কোচের সহায়তায় চর্চা করা অনুশীলন (Manipulation), নিখুঁত হওয়া নিখুঁতকরণ (Precision) ও কৌশল সমন্বয় করা সমন্বয়ন (Articulation)। সবশেষে চাপ ছাড়াই স্বতঃস্ফূর্ত বোলিং হলো স্বাভাবিকীকরণ।'],
['“তাত্ত্বিক পড়াশোনার পাশাপাশি মনোপেশিজ বা কায়িক দক্ষতা অর্জনের মাধ্যমেই একজন শিক্ষার্থী যেকোনো কাজে বাস্তব পারদর্শিতা লাভ করে”—বিশ্লেষণ করো।','উক্তিটি যথার্থ। তত্ত্ব জানলেই কাজটি করা যায় না; বারবার হাতে-কলমে চর্চা করতে হয়। আরিফ বোলিংয়ের কৌশল জানার পাশাপাশি অনুকরণ ও দীর্ঘ অনুশীলনের মাধ্যমে দক্ষতা আয়ত্ত করেছে বলেই ম্যাচের চাপের মধ্যেও সঠিকভাবে বল করতে পারছে। একইভাবে চিকিৎসা, প্রকৌশল বা কারিগরি কাজে তত্ত্বের সাথে প্রয়োগিক দক্ষতা মিললেই প্রকৃত পারদর্শিতা আসে। তাই জ্ঞানীয় ও কায়িক দক্ষতা একে অপরের পরিপূরক।']]}
];
return {G,D}}

const D=[
{t:'জেন্ডার সমতা ও সংবেদনশীলতা',k:'a',m:'Gender Sensitivity',s:'রফিকুল সাহেব তার পরিবারে ছেলে সজল ও মেয়ে তুলি—উভয়কেই সমান চোখে দেখেন। তবে প্রথাগত সমাজব্যবস্থার কারণে তিনি লক্ষ্য করলেন, বিজ্ঞানের বিষয়গুলোতে মেয়েদের চেয়ে ছেলেদের বেশি উৎসাহিত করা হয় এবং বিদ্যালয়ের দায়িত্ব বণ্টনে ছেলেদের কায়িক পরিশ্রমের কাজে ও মেয়েদের সাজসজ্জা বা পরিষ্কার করার কাজে দেওয়া হয়। তিনি ক্লাসের শিক্ষককে অনুরোধ করলেন শ্রেণিকক্ষে ও বিভিন্ন কার্যক্রমে জেন্ডার নিরপেক্ষ দৃষ্টিভঙ্গি নিশ্চিত করতে, যেন কোনো নির্দিষ্ট জেন্ডারের ওপর সামাজিক চিরাচরিত রোল বা ভূমিকা চাপিয়ে দেওয়া না হয়।',q:[
['‘জেন্ডার’ (Gender) এবং ‘সেক্স’ (Sex)-এর মধ্যে মূল পার্থক্য কী?','সেক্স হলো নারী ও পুরুষের জন্মগত জৈবিক বা শারীরিক পার্থক্য, যা প্রাকৃতিক ও সাধারণত অপরিবর্তনীয়। জেন্ডার হলো নারী ও পুরুষের ওপর সমাজ ও সংস্কৃতি কর্তৃক আরোপিত ভূমিকা, আচরণ ও প্রত্যাশা, যা সমাজভেদে ও সময়ের সাথে পরিবর্তনশীল।'],
['‘জেন্ডার সংবেদনশীল শিক্ষা’ বলতে কী বোঝায়? ব্যাখ্যা করো।','যে শিক্ষাব্যবস্থায় ছেলে ও মেয়ে উভয়ের চাহিদা, সক্ষমতা ও অধিকারকে সমান গুরুত্ব দেওয়া হয় এবং পাঠ্যবই, শিক্ষণ পদ্ধতি, শ্রেণিকক্ষের আচরণ ও কার্যক্রমে কোনো লিঙ্গভিত্তিক বৈষম্য বা গতানুগতিক ধারণা রাখা হয় না, তাকে জেন্ডার সংবেদনশীল শিক্ষা বলে। এতে সবাই সমান সুযোগ, সম্মান ও উৎসাহ পায়।'],
['উদ্দীপকের বিদ্যালয়ের কার্যক্রমে প্রতিফলিত প্রথাগত দৃষ্টিভঙ্গি কীভাবে জেন্ডার বৈষম্য তৈরি করে? আলোচনা করো।','উদ্দীপকের বিদ্যালয়ে বিজ্ঞানে ছেলেদের বেশি উৎসাহ দেওয়া হয় এবং দায়িত্ব বণ্টনে ছেলেদের কায়িক পরিশ্রমের কাজ ও মেয়েদের সাজসজ্জা-পরিষ্কারের কাজ দেওয়া হয়। এতে এই ধারণা জন্মায় যে বিজ্ঞান ও কঠিন কাজ ছেলেদের জন্য এবং মেয়েরা কেবল সাজসজ্জা ও গৃহস্থালির কাজের উপযোগী। ফলে মেয়েদের আত্মবিশ্বাস ও সুযোগ কমে যায়, ছেলেদের ওপরও গতানুগতিক ভূমিকা চাপে এবং সমাজে জেন্ডার বৈষম্য টিকে থাকে।'],
['সজল ও তুলির মতো সব শিক্ষার্থীর মানসিক বিকাশে জেন্ডারবান্ধব শিক্ষাবান্ধব পরিবেশের ভূমিকা মূল্যায়ন করো।','জেন্ডারবান্ধব পরিবেশে সজল ও তুলি সমান সুযোগ ও উৎসাহ পায়, ফলে তাদের আত্মবিশ্বাস, আত্মমর্যাদা ও নিজের সামর্থ্যে আস্থা বাড়ে। তুলি বিজ্ঞানে আগ্রহী হতে পারে এবং সজল সব ধরনের কাজে অংশ নিতে শেখে। এতে একে অপরকে সম্মান করার মনোভাব গড়ে ওঠে, ভয় ও হীনম্মন্যতা কমে এবং সামাজিক ও আবেগীয় বিকাশ সুষ্ঠু হয়। এ ধরনের পরিবেশ শিশুদের নিজের আগ্রহ ও প্রতিভা অনুযায়ী বিকশিত হতে সাহায্য করে এবং ভবিষ্যতে সমতাভিত্তিক সমাজ গঠনে ভূমিকা রাখে। তাই মানসিক বিকাশে এর ভূমিকা অত্যন্ত গুরুত্বপূর্ণ।']]},
{t:'একীভূত শিক্ষার মৌলিক ধারণা ও গুরুত্ব',k:'c',m:'Inclusive Education',s:'‘আলোর পথ’ প্রাথমিক বিদ্যালয়ে আগে কেবল সাধারণ শিক্ষার্থীদের ভর্তি নেওয়া হতো। সম্প্রতি সরকারের নতুন শিক্ষানীতি অনুসরণ করে স্কুলটি সিদ্ধান্ত নেয় যে, এলাকার যেকোনো শিশু—তা সে আর্থিকভাবে অসচ্ছল হোক, ক্ষুদ্র নৃগোষ্ঠীর হোক কিংবা শারীরিক বা মানসিক প্রতিবন্ধকতা থাকুক—সবাইকে একই সাথে একই শ্রেণিকক্ষে পড়ালেখার সুযোগ দেওয়া হবে। প্রধান শিক্ষক বললেন, “কাউকে বাদ দিয়ে নয়, সবাইকে নিয়ে একসাথে শেখাই আমাদের মূল লক্ষ্য।”',q:[
['‘একীভূত শিক্ষা’ (Inclusive Education) কী?','লিঙ্গ, ধর্ম, জাতি, আর্থসামাজিক অবস্থা বা শারীরিক-মানসিক প্রতিবন্ধকতা নির্বিশেষে সব শিশুকে একই বিদ্যালয়ে, একই শ্রেণিকক্ষে প্রয়োজনীয় সহায়তাসহ শেখার সুযোগ দেওয়ার ব্যবস্থাকে একীভূত শিক্ষা বলে।'],
['‘সমন্বিত শিক্ষা’ (Integrated Education) এবং ‘একীভূত শিক্ষা’-এর মধ্যে প্রধান পার্থক্য বুঝিয়ে লেখো।','সমন্বিত শিক্ষায় বিশেষ চাহিদাসম্পন্ন শিশুকে সাধারণ বিদ্যালয়ে ভর্তি করা হয়, কিন্তু ব্যবস্থা অপরিবর্তিত থাকে এবং শিশুকেই ব্যবস্থার সাথে মানিয়ে নিতে হয়; অনেক সময় তারা আলাদা শ্রেণিতে থাকে। একীভূত শিক্ষায় শিশুর চাহিদা অনুযায়ী বিদ্যালয়ের পাঠ্যক্রম, পদ্ধতি ও পরিবেশ পরিবর্তন করা হয় এবং সবাই একসাথে সমান অংশগ্রহণের সুযোগ পায়।'],
['‘আলোর পথ’ প্রাথমিক বিদ্যালয়ের গৃহীত পদক্ষেপটি একীভূত শিক্ষার মূলনীতির সাথে কীভাবে সঙ্গতিপূর্ণ? ব্যাখ্যা করো।','একীভূত শিক্ষার মূলনীতি হলো কাউকে বাদ না দিয়ে সব শিশুর শিক্ষার অধিকার ও সমান সুযোগ নিশ্চিত করা। উদ্দীপকে স্কুলটি আগে কেবল সাধারণ শিক্ষার্থীদের ভর্তি নিত, কিন্তু এখন অসচ্ছল, ক্ষুদ্র নৃগোষ্ঠী ও প্রতিবন্ধী সব শিশুকে একই শ্রেণিকক্ষে পড়ানোর সিদ্ধান্ত নিয়েছে। এতে বৈচিত্র্যের স্বীকৃতি, সমান সুযোগ ও সবার অংশগ্রহণ নিশ্চিত হয়, যা একীভূত শিক্ষার মূলনীতির সাথে সঙ্গতিপূর্ণ।'],
['“জাতীয় উন্নয়ন ও সামাজিক বৈষম্য হ্রাসে একীভূত শিক্ষার ভূমিকা অপরিসীম”—উদ্দীপকের আলোকে উক্তিটি বিশ্লেষণ করো।','উক্তিটি যথার্থ। উদ্দীপকের স্কুলে অসচ্ছল, ক্ষুদ্র নৃগোষ্ঠী ও প্রতিবন্ধী শিশুরা সবার সাথে শিক্ষার সুযোগ পাচ্ছে। এতে তারা শিক্ষিত ও দক্ষ হয়ে কর্মসংস্থানের সুযোগ পায় এবং পরিবার ও দেশের অর্থনীতিতে অবদান রাখে, ফলে জাতীয় উন্নয়ন ত্বরান্বিত হয়। একসাথে পড়ার ফলে শিশুদের মধ্যে সহমর্মিতা, সহযোগিতা ও পারস্পরিক সম্মান গড়ে ওঠে এবং ধনী-দরিদ্র, সক্ষম-অক্ষমের ভেদাভেদ ও কুসংস্কার কমে। এভাবে একীভূত শিক্ষা মানবসম্পদ উন্নয়ন ও সামাজিক বৈষম্য হ্রাসে গুরুত্বপূর্ণ ভূমিকা রাখে।']]},
{t:'বিশেষ চাহিদাসম্পন্ন ও বৈচিত্র্যময় শিক্ষার্থীদের অন্তর্ভুক্তিকরণ',k:'p2',m:'Special Needs',s:'ষষ্ঠ শ্রেণির শিক্ষার্থী অয়ন দৃষ্টিপ্রতিবন্ধী। সে ব্রেইল পদ্ধতির সাহায্যে পড়াশোনা করে। সাধারণ স্কুলে ভর্তি হওয়ার পর প্রথম দিকে কিছু সহপাঠী তার সাথে মিশতে দ্বিধা করত। কিন্তু গণিত শিক্ষক তানভীর সাহেব শ্রেণিকক্ষে এমন কিছু দলীয় কাজ (Group work) সাজালেন, যেখানে অয়নের তীক্ষ্ণ মেধা ও শ্রবণশক্তিকে কাজে লাগিয়ে দলটি বিজয়ী হলো। এতে করে অন্য শিক্ষার্থীদের দৃষ্টিভঙ্গি বদলে যায় এবং তারা অয়নকে বন্ধু হিসেবে গ্রহণ করে নেয়।',q:[
['‘বিশেষ চাহিদাসম্পন্ন শিশু’ (Children with Special Needs) কারা?','যেসব শিশু শারীরিক, বুদ্ধিবৃত্তিক, ইন্দ্রিয়গত (যেমন দৃষ্টি বা শ্রবণ), আচরণগত বা শিখনগত কারণে সাধারণ শিশুদের তুলনায় শিক্ষা ও বিকাশে বাড়তি সহায়তা বা বিশেষ ব্যবস্থার প্রয়োজন অনুভব করে, তাদের বিশেষ চাহিদাসম্পন্ন শিশু বলে।'],
['একীভূত শিক্ষার ক্ষেত্রে ‘শিক্ষণ-শেখানো পদ্ধতির অভিযোজন’ (Curriculum Adaptation) বলতে কী বোঝায়?','শিক্ষার্থীর সামর্থ্য ও চাহিদা অনুযায়ী পাঠ্যবিষয়, শিক্ষণ পদ্ধতি, উপকরণ, সময় ও মূল্যায়ন পদ্ধতিতে প্রয়োজনীয় পরিবর্তন বা সমন্বয় করাকে অভিযোজন বলে, যাতে প্রত্যেক শিক্ষার্থী সমানভাবে শিখতে পারে।'],
['শিক্ষক তানভীর সাহেবের ভূমিকা একীভূত শিক্ষার কোন নীতিকে নির্দেশ করে? ব্যাখ্যা করো।','তানভীর সাহেবের ভূমিকা একীভূত শিক্ষার সবার অংশগ্রহণ ও শিক্ষণ-পদ্ধতির অভিযোজনের নীতিকে নির্দেশ করে। তিনি দলীয় কাজ এমনভাবে সাজিয়েছেন যাতে অয়নের দৃষ্টিপ্রতিবন্ধকতা বাধা না হয়ে তার মেধা ও শ্রবণশক্তি কাজে লাগে এবং সে সমান অংশ নিতে পারে। প্রতিটি শিশুর দুর্বলতার চেয়ে সামর্থ্যকে গুরুত্ব দিয়ে সবাইকে সক্রিয় অংশগ্রহণের সুযোগ দেওয়াই এই নীতির মূল কথা।'],
['অয়নের মতো শিক্ষার্থীদের মূলধারার শিক্ষায় টিকিয়ে রাখতে সহপাঠী ও শিক্ষকের ইতিবাচক দৃষ্টিভঙ্গির গুরুত্ব মূল্যায়ন করো।','ইতিবাচক দৃষ্টিভঙ্গি বিশেষ চাহিদাসম্পন্ন শিক্ষার্থীর জন্য সবচেয়ে বড় সহায়ক শক্তি। উদ্দীপকে সহপাঠীরা প্রথমে দ্বিধা করলেও শিক্ষকের কৌশলে অয়নের সামর্থ্য দেখে তাকে বন্ধু হিসেবে গ্রহণ করেছে। এতে অয়নের আত্মবিশ্বাস বাড়ে, একাকিত্ব ও বিচ্ছিন্নতা কমে এবং স্কুলে আসার আগ্রহ ধরে থাকে, ফলে ঝরে পড়ার ঝুঁকি কমে। সহপাঠী ও শিক্ষকের সহমর্মিতা ও সহযোগিতা না থাকলে শুধু ভর্তি করালেই শিক্ষা সফল হয় না। তাই মূলধারায় টিকিয়ে রাখতে ইতিবাচক দৃষ্টিভঙ্গি অপরিহার্য।']]},
{t:'জেন্ডারবান্ধব ও একীভূত শিক্ষাঙ্গন অবকাঠামো',k:'a',m:'Infrastructure & Environment',s:'একটি মাধ্যমিক বিদ্যালয়ে নতুন ভবন নির্মাণের সময় হুইলচেয়ার ব্যবহারকারী শিক্ষার্থীদের জন্য ‘র‍্যাম্প’ (Ramp) তৈরি করা হয় এবং দৃষ্টিপ্রতিবন্ধীদের জন্য বিশেষ স্পর্শকাতর টাইলস বসানো হয়। পাশাপাশি ছেলে ও মেয়ে শিক্ষার্থীদের জন্য পৃথক ও নিরাপদ টয়লেটের ব্যবস্থা করা হয়। শ্রেণিকক্ষেও আলো-বাতাসের সুব্যবস্থা নিশ্চিত করা হয় এবং আসন বিন্যাস এমনভাবে করা হয় যাতে সকল শিক্ষার্থী শিক্ষককে স্পষ্টভাবে দেখতে ও শুনতে পায়।',q:[
['একীভূত শিক্ষায় ‘বাধাহীন পরিবেশ’ (Barrier-free Environment) কী?','এমন পরিবেশ, যেখানে ভৌত (সিঁড়ি, দরজা, টয়লেট), যোগাযোগ ও মনোভাবগত কোনো বাধা থাকে না এবং সব শিক্ষার্থী নির্বিঘ্নে চলাচল, প্রবেশ ও শিখতে পারে, তাকে বাধাহীন পরিবেশ বলে।'],
['বিদ্যালয়ে জেন্ডারবান্ধব টয়লেট ও স্যানিটেশন ব্যবস্থা কেন একীভূত শিক্ষার অংশ?','পৃথক ও নিরাপদ টয়লেট না থাকলে মেয়েরা, বিশেষ করে ঋতুকালে, নিরাপত্তাহীনতা ও অস্বস্তির কারণে স্কুলে আসা বন্ধ করে দিতে পারে বা ঝরে পড়ে। তাই নিরাপদ স্যানিটেশন সবার, বিশেষত মেয়েদের ও প্রতিবন্ধীদের, নিয়মিত উপস্থিতি, মর্যাদা ও অংশগ্রহণ নিশ্চিত করে, যা একীভূত শিক্ষার লক্ষ্য।'],
['উদ্দীপকের বিদ্যালয়ের অবকাঠামোগত পরিবর্তনগুলো কীভাবে একীভূত শিক্ষা বাস্তবায়নে সহায়তা করবে? ব্যাখ্যা করো।','র‍্যাম্প হুইলচেয়ার ব্যবহারকারী শিক্ষার্থীদের সহজে ভবনে ঢুকতে ও চলাফেরা করতে দেবে। স্পর্শকাতর টাইলস দৃষ্টিপ্রতিবন্ধীদের অন্যের সাহায্য ছাড়া পথ চিনে চলতে সাহায্য করবে। ছেলে ও মেয়েদের জন্য পৃথক নিরাপদ টয়লেট নিরাপত্তা ও মর্যাদা নিশ্চিত করবে। আলো-বাতাসের ব্যবস্থা ও আসন বিন্যাস সবাইকে শিক্ষককে স্পষ্ট দেখতে ও শুনতে সহায়তা করবে। এভাবে সব শিক্ষার্থী সমান সুযোগে অংশ নিতে পারবে এবং একীভূত শিক্ষা বাস্তবায়িত হবে।'],
['“কেবল কারিকুলাম নয়, শিক্ষাঙ্গনের ভৌত অবকাঠামো ও জেন্ডারবান্ধব পরিবেশই একীভূত শিক্ষার সফলতা নিশ্চিত করে”—বিশ্লেষণ করো।','উক্তিটি যথার্থ। কারিকুলাম যত ভালোই হোক, স্কুলে র‍্যাম্প, নিরাপদ টয়লেট বা উপযুক্ত আসনের মতো ভৌত সুবিধা না থাকলে প্রতিবন্ধী শিক্ষার্থীরা ও মেয়েরা শ্রেণিকক্ষ পর্যন্ত পৌঁছাতেই পারে না। উদ্দীপকের স্কুলে এসব সুবিধা থাকায় সব শিক্ষার্থী সমান সুযোগে শিখতে পারবে। আবার জেন্ডারবান্ধব পরিবেশ নিরাপত্তা ও সম্মান নিশ্চিত করে উপস্থিতি ও অংশগ্রহণ বাড়ায়। তবে একীভূত শিক্ষার সফলতার জন্য উপযুক্ত কারিকুলাম, প্রশিক্ষিত শিক্ষক ও ইতিবাচক দৃষ্টিভঙ্গিও প্রয়োজন। তাই অবকাঠামো ও পরিবেশ অত্যন্ত গুরুত্বপূর্ণ, তবে তা অন্য উপাদানের পরিপূরক।']]}
];
return {G,D}}
const SETS=[
{id:'bloom',cls:'c',title:'ব্লুমের ট্যাক্সোনমি: জ্ঞানীয়, আবেগীয় ও মনোপেশিজ ক্ষেত্র',sub:'Bloom\'s Taxonomy-এর তিনটি ডোমেইনভিত্তিক সৃজনশীল প্রশ্ন',h1:'বেঞ্জামিন ব্লুমের শিক্ষাতত্ত্ব: পূর্ণাঙ্গ সৃজনশীল প্রশ্নাবলী',h2:'Bloom\'s Taxonomy-এর তিনটি ডোমেইন (Cognitive, Affective, Psychomotor) ভিত্তিক মূল্যায়ন — উত্তরসহ',data:dataBloom()},
{id:'gender',cls:'a',title:'জেন্ডার সমতা ও একীভূত শিক্ষা',sub:'Gender & Inclusive Education — ধারণা, নীতিমালা, বিশেষ চাহিদা ও অবকাঠামো',h1:'জেন্ডার ও একীভূত শিক্ষা: সৃজনশীল প্রশ্নমালা',h2:'Gender & Inclusive Education — ধারণা, নীতিমালা, বিশেষ চাহিদা ও অবকাঠামো — উত্তরসহ',data:dataGender()}
];
const L=['ক','খ','গ','ঘ'],N=['১','২','৩','৪','৫','৬','৭'];
const BN=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const app=document.getElementById('app');
function home(){
 let h='<header><h1>সৃজনশীল প্রশ্ন</h1><p>উত্তরসহ অনুশীলন — শিরোনামে ক্লিক করে খুলুন</p></header><div class="top"><button class="th" onclick="toggleTheme()"></button></div>';
 SETS.forEach(s=>{const q=s.data.D.length;h+=`<div class="hc ${s.cls}" role="button" tabindex="0" onclick="go('${s.id}')" onkeydown="if(event.key==='Enter')go('${s.id}')"><h2>${s.title}</h2><p>${s.sub}</p><div class="tags"><span>${BN(q)}টি প্রশ্ন</span><span>${BN(q*4)}টি উত্তর</span></div></div>`});
 app.innerHTML=h;
}
function setView(s){
 const G=s.data.G,D=s.data.D;
 let h=`<span class="back" role="button" tabindex="0" onclick="back()">‹ Back</span><header><h1>${s.h1}</h1><p>${s.h2}</p></header><div class="bar"><button class="p" onclick="all_(true)">সব উত্তর দেখুন</button><button onclick="all_(false)">সব উত্তর লুকান</button><button class="th" onclick="toggleTheme()"></button></div>`;
 D.forEach((d,i)=>{
  if(G[i])h+=`<h2>${G[i]}</h2>`;
  h+=`<div class="card ${d.k}"><span class="m">${d.m}</span><h3>প্রশ্ন ${N[i]}: ${d.t}</h3><div class="st"><b>উদ্দীপক:</b> ${d.s}</div>`;
  d.q.forEach((x,j)=>{const id=`a${i}${j}`;
   h+=`<div class="q"><b>${L[j]}.</b> ${x[0]}<div><button class="sh" data-t="${id}" onclick="tg('${id}')">উত্তর দেখুন</button></div><div class="ans" id="${id}"><b>উত্তর:</b> ${x[1]}</div></div>`});
  h+='</div>';
 });
 app.innerHTML=h;
}
let cur='';
let pushed=false;
function go(id){try{history.pushState({id:id},'');pushed=true}catch(e){pushed=false}cur=id;route()}
function back(){if(pushed){history.back()}else{cur='';route()}}
window.addEventListener('popstate',function(e){cur=(e.state&&e.state.id)||'';route()});
function route(){
 const s=SETS.find(x=>x.id===cur);
 document.title=s?s.h1:'সৃজনশীল প্রশ্ন';
 s?setView(s):home();
 setTheme(document.documentElement.getAttribute('data-theme')||'light');
 window.scrollTo(0,0);
}
function tg(id){const e=document.getElementById(id),b=document.querySelector(`[data-t="${id}"]`);e.classList.toggle('on');b.textContent=e.classList.contains('on')?'উত্তর লুকান':'উত্তর দেখুন'}
function all_(v){document.querySelectorAll('.ans').forEach(e=>{e.classList.toggle('on',v);document.querySelector(`[data-t="${e.id}"]`).textContent=v?'উত্তর লুকান':'উত্তর দেখুন'})}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);document.querySelectorAll('.th').forEach(b=>b.textContent=t==='dark'?'☀️ লাইট মোড':'🌙 ডার্ক মোড');try{localStorage.setItem('theme',t)}catch(e){}}
function toggleTheme(){setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')}
(function(){let t=null;try{t=localStorage.getItem('theme')}catch(e){}
if(!t)t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t)})();
route();
</script>
</body>
</html>
