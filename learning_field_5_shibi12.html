<script>
const masterQuestionBank=[["ভাষা শেখার সময় পূর্ণ যোগাযোগের জন্য কয়টি দক্ষতা প্রয়োজন বলা হয়েছে?",["৩টি","৪টি","৫টি","৬টি"],1,0],["মাতৃভাষা শেখার সময় আমরা সাধারণত প্রথমে কোন দক্ষতা শিখি?",["Speaking","Reading","Writing","Listening"],3,0],["মাতৃভাষা শেখার ক্রমে সবশেষে কোন দক্ষতা শেখা হয়?",["Writing","Listening","Speaking","Reading"],0,0],["মাতৃভাষা শেখার ক্রমে Speaking-এর ঠিক পরে কোন দক্ষতা আসে?",["Listening","Writing","Reading","Grammar"],2,0],["পাঠ অনুযায়ী ভাষা (Language) কী?",["A set of fixed written rules only","A list of dictionary words","A collection of grammar tables","A system of arbitrary vocal symbols"],3,0],["আন্তর্জাতিক যোগাযোগ, সহযোগিতা ও সম্প্রীতিপূর্ণ সহাবস্থানের জন্য কোন ভাষা আন্তর্জাতিক ভাষা হিসেবে উঠে এসেছে?",["Hindi","English","French","Bengali"],1,0],["পাঠ অনুযায়ী “Listening” কী?",["Delivery of language through the mouth","Writing language on paper","Receiving language through the ears","Reading language aloud"],2,0],["Listening-এ কানের মাধ্যমে কোন বিষয়গুলো গ্রহণ করা হয় বলে উল্লেখ আছে?",["Letters, stress, rhythm and pauses","Pictures, colours and shapes","Handwriting and spelling","Punctuation marks only"],0,0],["শোনা শব্দকে অর্থপূর্ণ বার্তায় রূপান্তর করতে আমরা কোন অঙ্গ ব্যবহার করি?",["Tongue","Lips","Brain","Lungs"],2,0],["পাঠ অনুযায়ী কারা সাধারণত poor listener?",["People who have difficulty concentrating","People who speak too fast","People who read a lot","People who write diaries"],0,0],["কোন ভাষায় শোনার জন্য আরও বেশি মনোযোগ প্রয়োজন বলা হয়েছে?",["A native language","A written language","A computer language","A second language"],3,0],["Listening দক্ষতা অনুশীলনের জন্য পাঠে কোনটি পরামর্শ দেওয়া হয়েছে?",["Memorizing grammar rules","Listening to live or recorded voices","Writing long essays","Avoiding native speakers always"],1,0],["পাঠ অনুযায়ী “Speaking” কী?",["The delivery of language through the mouth","Receiving language through the ears","Understanding written text","Copying words into a notebook"],0,0],["কথা বলার সময় শব্দ সৃষ্টিতে ব্যবহৃত অঙ্গ হিসেবে কোনটি উল্লেখ আছে?",["Eyes","Ears","Lungs","Nose"],2,0],["চারটি ভাষা-দক্ষতার মধ্যে Speaking কত নম্বর দক্ষতা?",["প্রথম","দ্বিতীয়","তৃতীয়","চতুর্থ"],1,0],["দুই বা ততোধিক ব্যক্তি পরস্পর কথা বললে সেই কথোপকথনকে কী বলা হয়?",["Monologue","Lecture","Dictation","Dialogue"],3,0],["Informal speaking সাধারণত কাদের সঙ্গে ব্যবহৃত হয়?",["Business partners only","Family and friends, or people you know well","Teachers in exams","People you meet for the first time"],1,0],["Formal speaking কোন পরিস্থিতিতে ঘটে?",["With family at home","With close friends at play","While talking to oneself","Business or academic situations, or when meeting people for the first time"],3,0],["চিত্র অনুযায়ী INPUT-এর অন্তর্ভুক্ত দক্ষতা কোনগুলো?",["Listening and reading","Speaking and writing","Listening and speaking","Reading and writing"],0,0],["চিত্র অনুযায়ী OUTPUT-এর অন্তর্ভুক্ত দক্ষতা কোনগুলো?",["Listening and reading","Listening and writing","Speaking and writing","Reading and speaking"],2,0],["ইংরেজিতে কথা বলতে আমরা কেন দ্বিধা করি বলে পাঠে উল্লেখ আছে?",["We have no books to read","English has no grammar","English is spoken in only one country","We feel we lack fluency and may make grammatical mistakes"],3,0],["English Leap-এর সাফল্যের জন্য মোট কয়টি top tips-এর কথা বলা হয়েছে?",["Five","Ten","Seven","Twelve"],1,0],["“Do not hesitate” টিপস অনুযায়ী বন্ধুদের বৃত্তে কী সিদ্ধান্ত নেওয়ার কথা বলা হয়েছে?",["Talk only in the native language","Talk only in writing","Talk only in English with each other","Avoid talking in groups"],2,0],["ডায়েরি রাখার অভ্যাস কোন দক্ষতা চর্চার জন্য চমৎকার উপায়?",["Writing skills","Listening skills","Reading skills","Speaking skills"],0,0],["পত্রিকা পড়ার সময় অজানা শব্দের ক্ষেত্রে কী করার কথা বলা হয়েছে?",["Skip them completely","Replace them with native words","Note down the words and learn their meanings","Ignore the whole article"],2,0],["ইংরেজি সিনেমা দেখার শুরুতে কথোপকথন অনুসরণ করতে কী পড়া যায়?",["Sub-titles","Song lyrics","Dictionary","D }
function start(){
  clearInterval(tm);done=false;left=TIME;
  const take=Math.min(N,masterQuestionBank.length);let pick=[];
  QUOTA.forEach((n,t)=>{pick=pick.concat(shuf(masterQuestionBank.filter(x=>x.t===t)).slice(0,n))});
  if(pick.length<take){const rest=shuf(masterQuestionBank.filter(x=>!pick.includes(x)));pick=pick.concat(rest.slice(0,take-pick.length))}
  pick=shuf(pick.slice(0,take));
  Q=pick.map(x=>{const idx=shuf(x.o.map((t,i)=>i));return{q:x.q,t:x.t,o:idx.map(i=>x.o[i]),a:idx.indexOf(x.a)}});

    box.appendChild(c)});
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pickOpt(+b.dataset.i,+b.dataset.j));

}
function pickOpt(i,j){
  if(done||ans[i]>=0)return;ans[i]=j;

}
function upd(){$('prog').textContent=bn(ans.filter(a=>a>=0).length)+'/'+bn(Q.length)}

}

  const miss=[];ans.forEach((a,i)=>{if(a<0)miss.push(i)});

  clearInterval(tm);finish()
}
function finish(){

  Q.forEach((q,i)=>{

  });

  $('prog').textContent='স্কোর: '+bn(score.toFixed(2).replace(/\.?0+$/,''))+'/'+bn(Q.length);

}

document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(),blk=(e.ctrlKey&&['c','s','u'].includes(k))||e.key==='F12'||e.key==='PrintScreen';
  if(blk){e.preventDefault();try{navigator.clipboard.writeText('')}catch(_){}alert('এই পেজে কপি/সেভ/সোর্স দেখা নিষিদ্ধ।')}});
document.addEventListener('keyup',e=>{if(e.key==='PrintScreen'){try{navigator.clipboard.writeText('')}catch(_){}alert('স্ক্রিনশট নেওয়া নিষিদ্ধ।')}});
window.addEventListener('load',()=>{info();start()});
</script>
</body>
</html>
