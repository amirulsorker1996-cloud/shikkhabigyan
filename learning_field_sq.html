<style>

<div class="s">প্রশ্নে ক্লিক করলে উত্তর দেখা যাবে • প্রতিটি প্রশ্নের মান ৫</div>

<script>
const D=[{"q": "আধুনিক শিখন-শিক্ষণ আটটি পদ্ধতির নাম বলুন।", "a": "<p>আধুনিক শিখন-শিক্ষণ পদ্ধতি শিক্ষার্থীকেন্দ্রিক; এখানে শিক্ষার্থী সক্রিয়ভাবে অংশ নিয়ে নিজে শেখে। আটটি পদ্ধতি:</p>\n<ol>\n<li>সহযোগিতামূলক শিখন পদ্ধতি</li>\n<li>সমস্যা সমাধান পদ্ধতি</li>\n<li>প্রকল্প পদ্ধতি</li>\n<li>আবিষ্কার ও অনুসন্ধান পদ্ধতি</li>\n<li>ভূমিকা অভিনয় পদ্ধতি</li>\n<li>সিমুলেশন (অনুকরণ) পদ্ধতি</li>\n<li>মস্তিষ্ক ঝড় (ব্রেইনস্টর্মিং) পদ্ধতি</li>\n<li>আইসিটিভিত্তিক শিখন পদ্ধতি (ফ্লিপড ক্লাসরুম সহ)</li>\n</ol>"}, {"q": "কারিকুলাম ও সিলেবাসের পার্থক্য লিখুন।", "a": "<table>\n<tr><th style=\"width:8%\">নং</th><th>কারিকুলাম</th><th>সিলেবাস</th></tr>\n<tr><td>১</td><td>শিক্ষাক্রমের পরিধি ব্যাপক; শিক্ষার উদ্দেশ্য, বিষয়বস্তু, পদ্ধতি ও মূল্যায়ন সবই এর অন্তর্ভুক্ত।</td><td>পরিধি সীমিত; শুধু নির্দিষ্ট বিষয়ের পাঠ্যসূচি।</td></tr>\n<tr><td>২</td><td>শ্রেণিকক্ষের ভেতরে ও বাইরের সব শিখন অভিজ্ঞতা এতে থাকে।</td><td>কেবল শ্রেণিকক্ষে পাঠদানের বিষয়বস্তু থাকে।</td></tr>\n<tr><td>৩</td><td>জাতীয় পর্যায়ে শিক্ষাবিশেষজ্ঞগণ প্রণয়ন করেন (যেমন: এনসিটিবি)।</td><td>সাধারণত বিষয়শিক্ষক বা কমিটি প্রণয়ন করেন।</td></tr>\n<tr><td>৪</td><td>দীর্ঘমেয়াদি; কয়েক বছর পর পরিবর্তন হয়।</td><td>স্বল্পমেয়াদি; সাধারণত এক বছর বা এক সেশনের জন্য।</td></tr>\n<tr><td>৫</td><td>এটি সিলেবাসের উৎস ও নির্দেশক।</td><td>এটি কারিকুলামের একটি অংশ।</td></tr>\n</table>"}, {"q": "পাঠ পরিকল্পনা কী? এর তিনটি সুবিধা লিখুন।", "a": "<p><b>পাঠ পরিকল্পনা:</b> একটি নির্দিষ্ট শ্রেণিতে নির্দিষ্ট সময়ে যে পাঠ উপস্থাপন করা হবে, তার উদ্দেশ্য, বিষয়বস্তু, শিখন-শেখানো কার্যক্রম, উপকরণ ও মূল্যায়ন কৌশল সম্পর্কে শিক্ষকের আগে থেকে তৈরি করা লিখিত রূপরেখাকে পাঠ পরিকল্পনা বলে।</p>\n<p><b>সুবিধা:</b></p>\n<ol>\n<li>পাঠদান সুশৃঙ্খল ও লক্ষ্যভিত্তিক হয়; নির্ধারিত সময়ে পাঠ শেষ করা যায়।</li>\n<li>শিক্ষক আত্মবিশ্বাসী হন এবং উপযুক্ত পদ্ধতি ও উপকরণ আগে থেকেই নির্বাচন করতে পারেন।</li>\n<li>পাঠের উদ্দেশ্য অর্জিত হলো কি না তা মূল্যায়ন করা সহজ হয় এবং শিক্ষার্থীর শিখন মান বাড়ে।</li>\n</ol>"}, {"q": "একীভূত শিক্ষা কী? একীভূত শিক্ষা বাস্তবায়নের পাঁচটি উপায় লিখুন।", "a": "<p><b>একীভূত শিক্ষা:</b> যে শিক্ষাব্যবস্থায় ধর্ম, বর্ণ, লিঙ্গ, আর্থসামাজিক অবস্থা কিংবা প্রতিবন্ধিতা নির্বিশেষে সব শিশু একই শ্রেণিকক্ষে, সমান সুযোগ নিয়ে একসঙ্গে শিক্ষা গ্রহণ করে, তাকে একীভূত শিক্ষা বলে।</p>\n<p><b>বাস্তবায়নের উপায়:</b></p>\n<ol>\n<li>সব শিশুর জন্য বিদ্যালয়ে ভর্তি নিশ্চিত করা।</li>\n<li>ঢালু পথ, শৌচাগার ও শ্রেণিকক্ষ প্রতিবন্ধীবান্ধব করা।</li>\n<li>শিক্ষকদের একীভূত শিক্ষার প্রশিক্ষণ দেওয়া।</li>\n<li>শিক্ষার্থীর চাহিদা অনুযায়ী নমনীয় কারিকুলাম ও সহায়ক উপকরণ (ব্রেইল, হিয়ারিং এইড ইত্যাদি) ব্যবহার করা।</li>\n<li>অভিভাবক ও সমাজকে সচেতন করা এবং সহপাঠীদের মধ্যে সহযোগিতামূলক পরিবেশ গড়ে তোলা।</li>\n</ol>"}, {"q": "জেন্ডার বৈষম্য নিরসনে পাঁচটি করণীয় লিখুন।", "a": "<ol>\n<li>ছেলে ও মেয়ে উভয়ের জন্য শিক্ষায় সমান সুযোগ ও অংশগ্রহণ নিশ্চিত করা।</li>\n<li>পাঠ্যবইয়ে লিঙ্গ-সংবেদনশীল ও বৈষম্যহীন বিষয়বস্তু অন্তর্ভুক্ত করা।</li>\n<li>শ্রেণিকক্ষে শিক্ষক কর্তৃক ছেলে-মেয়েকে সমান গুরুত্ব ও আচরণ করা এবং সব কাজে সমান দায়িত্ব দেওয়া।</li>\n<li>বাল্যবিবাহ, যৌতুক ও নারী নির্যাতন রোধে সামাজিক সচেতনতা তৈরি করা।</li>\n<li>মেয়েদের জন্য উপবৃত্তি, নিরাপদ যাতায়াত ও আলাদা শৌচাগারের ব্যবস্থা করা এবং শিক্ষক নিয়োগে নারীর অংশগ্রহণ বাড়ানো।</li>\n</ol>"}, {"q": "কর্মসহায়ক গবেষণা কী? সংক্ষেপে কর্মসহায়ক গবেষণার চারটি ধাপ উল্লেখ করুন।", "a": "<p><b>কর্মসহায়ক গবেষণা:</b> শিক্ষক নিজের শ্রেণিকক্ষ বা কর্মক্ষেত্রের কোনো বাস্তব সমস্যা চিহ্নিত করে পদ্ধতিগতভাবে তা সমাধানের জন্য যে গবেষণা করেন, তাকে কর্মসহায়ক গবেষণা (অ্যাকশন রিসার্চ) বলে।</p>\n<p><b>চারটি ধাপ:</b></p>\n<ol>\n<li><b>পরিকল্পনা:</b> সমস্যা চিহ্নিত করে সমাধানের কৌশল ঠিক করা।</li>\n<li><b>কাজ (বাস্তবায়ন):</b> পরিকল্পনা অনুযায়ী শ্রেণিকক্ষে কৌশল প্রয়োগ করা।</li>\n<li><b>পর্যবেক্ষণ:</b> প্রয়োগের ফলাফল ও তথ্য সংগ্রহ করা।</li>\n<li><b>প্রতিফলন:</b> তথ্য বিশ্লেষণ করে ফলাফল মূল্যায়ন করা এবং প্রয়োজনে পরবর্তী চক্রের পরিকল্পনা করা।</li>\n</ol>"}, {"q": "সিমুলেশন ও মাইক্রোটিচিং কী? সংক্ষেপে ব্যাখ্যা করুন।", "a": "<p><b>সিমুলেশন:</b> বাস্তব পরিস্থিতির অনুরূপ কৃত্রিম পরিস্থিতি তৈরি করে শিক্ষার্থীকে হাতেকলমে শেখানোর পদ্ধতিকে সিমুলেশন বলে। এতে শিক্ষার্থী ঝুঁকিহীনভাবে বাস্তব অভিজ্ঞতা লাভ করে। যেমন: বিমান চালনার সিমুলেটর, ভূমিকা অভিনয়, কম্পিউটার সিমুলেশন।</p>\n<p><b>মাইক্রোটিচিং:</b> শিক্ষক-প্রশিক্ষণের এমন একটি কৌশল, যেখানে ৫–১০ জন শিক্ষার্থীকে ৫–১০ মিনিট ধরে একটি নির্দিষ্ট দক্ষতার ওপর ছোট পাঠ উপস্থাপন করা হয় এবং সঙ্গে সঙ্গে ফিডব্যাক দেওয়া হয়। এটি ১৯৬৩ সালে স্ট্যানফোর্ড বিশ্ববিদ্যালয়ে ডুয়াইট অ্যালেন প্রবর্তন করেন। এর চক্র: পরিকল্পনা → শিক্ষাদান → ফিডব্যাক → পুনর্পরিকল্পনা → পুনঃশিক্ষাদান → পুনঃফিডব্যাক।</p>"}, {"q": "মনোবিজ্ঞানের থর্নডাইক কে? উনার তিনটি সূত্রের ব্যাখ্যা করুন।", "a": "<p>এডওয়ার্ড লি থর্নডাইক (১৮৭৪–১৯৪৯) একজন আমেরিকান মনোবিজ্ঞানী ও শিক্ষাবিদ। তিনি ‘সংযোজনবাদ’ (Connectionism) বা উদ্দীপক-সাড়া তত্ত্বের প্রবক্তা এবং বিড়ালের ওপর ‘ধাঁধা বাক্স’ পরীক্ষা করে চেষ্টা-ভুলের মাধ্যমে শিখন তত্ত্ব দেন। তাঁর তিনটি প্রধান সূত্র:</p>\n<ol>\n<li><b>প্রস্তুতির সূত্র:</b> শিক্ষার্থী মানসিকভাবে প্রস্তুত থাকলে শিখন কার্যকর ও আনন্দদায়ক হয়; প্রস্তুত না থাকলে জোর করে শেখানো বিরক্তিকর ও নিষ্ফল হয়।</li>\n<li><b>অনুশীলনের সূত্র:</b> বারবার অনুশীলন করলে শিখন দৃঢ় হয় (ব্যবহারের সূত্র) এবং অনুশীলন না করলে তা দুর্বল হয়ে ভুলে যাওয়া হয় (অব্যবহারের সূত্র)।</li>\n<li><b>ফলাফলের সূত্র:</b> কাজের ফল সুখকর বা পুরস্কারযোগ্য হলে সংযোগ দৃঢ় হয় এবং আবার সেই কাজ করার আগ্রহ জন্মে; ফল অপ্রীতিকর হলে সংযোগ দুর্বল হয়।</li>\n</ol>"}, {"q": "TPACK এর সংক্ষিপ্ত বর্ণনা করুন।", "a": "<p>TPACK-এর পূর্ণরূপ <b>Technological Pedagogical Content Knowledge</b>। ২০০৬ সালে মিশ্র ও কোহলার শুলম্যানের PCK ধারণার সঙ্গে প্রযুক্তি যুক্ত করে এ কাঠামো উপস্থাপন করেন। এর মূল কথা হলো, কার্যকর পাঠদানের জন্য শিক্ষকের তিন ধরনের জ্ঞানের সমন্বয় প্রয়োজন:</p>\n<ul>\n<li><b>বিষয়বস্তুর জ্ঞান (CK):</b> যে বিষয় পড়ানো হবে তার জ্ঞান।</li>\n<li><b>শিক্ষণ-পদ্ধতির জ্ঞান (PK):</b> কীভাবে পড়ানো হবে তার কৌশল।</li>\n<li><b>প্রযুক্তির জ্ঞান (TK):</b> ডিজিটাল উপকরণ ও আইসিটি ব্যবহারের দক্ষতা।</li>\n</ul>\n<p>এই তিনটির ছেদ থেকে আরও চারটি অংশ তৈরি হয়: PCK, TCK, TPK ও TPACK। ফলে শিক্ষক প্রযুক্তি ব্যবহার করে বিষয়বস্তুকে উপযুক্ত পদ্ধতিতে উপস্থাপন করতে পারেন।</p>"}, {"q": "ধারাবাহিক মূল্যায়নের পাঁচটি প্রয়োজনীয়তা লিখুন।", "a": "<ol>\n<li>শিক্ষার্থীর শিখন অগ্রগতি নিয়মিত জানা যায়।</li>\n<li>শিক্ষার্থীর দুর্বলতা ও শিখন ঘাটতি দ্রুত শনাক্ত করে প্রতিকারমূলক ব্যবস্থা নেওয়া যায়।</li>\n<li>পরীক্ষাভীতি ও মুখস্থনির্ভরতা কমে এবং শিক্ষার্থী নিয়মিত পড়ায় অভ্যস্ত হয়।</li>\n<li>জ্ঞানের পাশাপাশি দক্ষতা ও দৃষ্টিভঙ্গির মূল্যায়ন করা যায়।</li>\n<li>শিক্ষক নিজের পাঠদান পদ্ধতির কার্যকারিতা যাচাই করে প্রয়োজনে তা পরিবর্তন করতে পারেন।</li>\n</ol>"}, {"q": "অ্যাকশন রিসার্চ কী?", "a": "<p><b>সংজ্ঞা:</b> অ্যাকশন রিসার্চ হলো এমন একটি ব্যবহারিক গবেষণা পদ্ধতি, যেখানে শিক্ষক বা কর্মী নিজের কর্মক্ষেত্রের সমস্যা চিহ্নিত করেন, সমাধানের কৌশল প্রয়োগ করেন এবং ফলাফল পর্যালোচনা করে নিজের কাজের মান উন্নত করেন। কার্ট লিউইনকে এর জনক বলা হয়।</p>\n<p><b>বৈশিষ্ট্য:</b></p>\n<ul>\n<li>শিক্ষক নিজেই গবেষক।</li>\n<li>বাস্তব সমস্যাভিত্তিক ও তাৎক্ষণিক সমাধানমুখী।</li>\n<li>চক্রাকার প্রক্রিয়া: পরিকল্পনা → কাজ → পর্যবেক্ষণ → প্রতিফলন।</li>\n<li>সহযোগিতামূলক ও ক্ষুদ্র পরিসরের।</li>\n</ul>\n<p><b>গুরুত্ব:</b> এর মাধ্যমে শ্রেণিকক্ষের সমস্যার সমাধান হয়, শিক্ষকের পেশাগত উন্নয়ন ঘটে এবং শিক্ষার মান বৃদ্ধি পায়।</p>"}];
function esc(x){return x}
function render(a){
 const l=document.getElementById('l');l.innerHTML='';
 a.forEach((it,i)=>{
  const c=document.createElement('div');c.className='c';
  const ans=it.a.replace(/<table>/g,'<div class="tblw"><table>').replace(/<\/table>/g,'</table></div>');
  c.innerHTML='<button class="qb"><span class="tx">'+it.q+'</span><span class="ar">▼</span></button><div class="ans">'+ans+'</div>';
  c.querySelector('.qb').onclick=()=>c.classList.toggle('open');
  l.appendChild(c);
 });
}

 const a=D.slice();
 for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
 render(a);window.scrollTo({top:0,behavior:'smooth'});
}

function setT(d){document.documentElement.setAttribute('data-theme',d?'dark':'light');document.getElementById('th').textContent=d?'☀️ Light':'🌙 Dark';}

(function(){let t=null;try{t=localStorage.getItem('theme')}catch(e){}
if(!t)t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';setT(t==='dark');})();
shuf();
